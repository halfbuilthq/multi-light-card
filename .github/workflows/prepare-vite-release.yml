name: Prepare Vite maintenance release draft

on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-vite-release.yml]

permissions:
  contents: write

concurrency:
  group: prepare-vite-maintenance-release
  cancel-in-progress: false

jobs:
  prepare-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test and build release bundle
        run: npm run check
      - name: Create tagged draft with tested bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: "0.1.2"
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          tag="v${RELEASE_VERSION}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v version="$RELEASE_VERSION" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file"
          test -s "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          if existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null)"; then
            test "$existing_sha" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}"
          fi
          gh release create "$tag" "dist/multi-light-card.js" \
            --draft --verify-tag --title "$tag" --notes-file "$notes_file"
