name: Bug report
description: Report a reproducible card problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Card version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: home-assistant
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Card configuration
      description: Remove private entity names or other sensitive details.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and reproduction steps.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console output
      render: text

