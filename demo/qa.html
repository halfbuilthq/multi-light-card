<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Light Card design comparison</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #080b0e;
        color: #eef2f4;
      }

      body {
        margin: 0;
        padding: 24px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 20px;
      }

      .comparison {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        align-items: start;
      }

      figure {
        margin: 0;
      }

      figcaption {
        margin-bottom: 8px;
        color: #aab1b8;
        font-size: 13px;
        font-weight: 700;
      }

      img {
        display: block;
        width: 100%;
        border: 1px solid #34383c;
        border-radius: 18px;
      }
    </style>
  </head>
  <body>
    <h1>Design QA · Multi-Light Card</h1>
    <div class="comparison">
      <figure>
        <figcaption>Selected refined mockup</figcaption>
        <img src="/docs/design-reference.png" alt="Selected refined design" />
      </figure>
      <figure>
        <figcaption>Browser-rendered implementation</figcaption>
        <img
          src="/docs/multi-light-card-preview.png"
          alt="Rendered Multi-Light Card"
        />
      </figure>
    </div>
  </body>
</html>
